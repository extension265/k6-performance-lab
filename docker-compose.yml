name: k6-performance-lab

services:
  postgres:
    image: postgres:18.6-alpine3.24 # pinned, verified 2026-11-10
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow # local-only test stack
      POSTGRES_DB: payflow
    volumes:
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP, not the unix socket: the entrypoint's temporary init server only listens on the
      # socket, so a socket check would report healthy while init.sql is still seeding.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U payflow -d payflow"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 300s
    # Capped too, so results don't depend on what else the laptop is doing.
    cpus: "2.0"
    mem_limit: 1g

  api:
    build: ./api
    image: payflow-api:local
    ports:
      - "3000:3000"
    environment:
      PGHOST: postgres
      PGUSER: payflow
      PGPASSWORD: payflow
      PGDATABASE: payflow
      # Seeded bottlenecks: BOTTLENECK_MODE sets the default, each flag can override it (on|off).
      BOTTLENECK_MODE: ${BOTTLENECK_MODE:-on}
      BOTTLENECK_POOL: ${BOTTLENECK_POOL:-}
      BOTTLENECK_INDEX: ${BOTTLENECK_INDEX:-}
      BOTTLENECK_N_PLUS_ONE: ${BOTTLENECK_N_PLUS_ONE:-}
      BOTTLENECK_BCRYPT: ${BOTTLENECK_BCRYPT:-}
      PROVIDER_LATENCY_MIN_MS: ${PROVIDER_LATENCY_MIN_MS:-50}
      PROVIDER_LATENCY_MAX_MS: ${PROVIDER_LATENCY_MAX_MS:-150}
      DECLINE_RATE: ${DECLINE_RATE:-0.02}
      # Local-only secrets for the mock API. Never reuse anywhere real.
      JWT_SECRET: local-dev-only-jwt-secret
      WEBHOOK_SECRET: local-dev-only-webhook-secret
      TEST_USER_EMAIL: loadtest@payflow.local
      TEST_USER_PASSWORD: payflow-loadtest
    depends_on:
      postgres:
        condition: service_healthy
    # Resource limits keep results reproducible across runs and machines.
    cpus: "1.0"
    mem_limit: 512m

  # ---------------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v3.16.0 # pinned, verified 2026-11-10
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver # k6 pushes its metrics here (experimental-prometheus-rw)
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    cpus: "1.0"
    mem_limit: 1g

  grafana:
    image: grafana/grafana:13.3.1 # pinned, verified 2026-11-10
    environment:
      # Local lab only (bound to 127.0.0.1): anyone can view without logging in (Grafana 13 allows
      # only the Viewer role anonymously). Sign in as admin/admin to edit; dashboards live in the repo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-vs-load.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000" # 3000 is the API
    depends_on:
      - prometheus
    cpus: "0.5"
    mem_limit: 512m

  # Per-container CPU/memory, including the k6 load generator itself.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6 # pinned, verified 2026-11-10
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,network,oom_event,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    cpus: "0.5"
    mem_limit: 256m

  # ---------------------------------------------------------------- tools (not started by stack:up)
  # Contract tests (npm run test:contract). Built from postman/Dockerfile; not started by stack:up.
  newman:
    build: ./postman
    image: payflow-newman:local
    profiles: ["tools"]
    volumes:
      - ./postman:/etc/newman:ro
      - ./reports:/reports

  # Load generator. Not started by stack:up (profile); run via npm run test:<scenario>.
  # Runs inside the compose network so traffic doesn't go through Docker Desktop port forwarding.
  k6:
    image: grafana/k6:2.3.0 # pinned, verified 2026-11-10
    profiles: ["tools"]
    volumes:
      - ./k6:/scripts:ro
      - ./reports:/reports
    environment:
      TARGET: docker
      REPORTS_DIR: /reports
    # The load generator shares the laptop with the system under test: cap it, and watch its CPU
    # in Grafana. A run where k6 sits above 80% of this limit is invalid (PLAN.md Phase 6).
    cpus: "2.0"
    mem_limit: 1g

volumes:
  pgdata:
  promdata:
